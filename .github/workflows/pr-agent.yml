name: PR Agent

# Thin per-repo shim that keeps event wiring local while reusing the
# centralized workflow logic from the platform repository.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    uses: wri/.github/.github/workflows/pr-agent-core.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
    secrets: inherit
